<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<title>KOL — Ads Dashboard GMV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/kol-db.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/adv-switcher.js"></script>
</head>
<body>
<div class="app-wrap">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="page-content">

      <div class="page-header">
        <div>
          <h2>🎯 KOL</h2>
          <p>Data Key Opinion Leader dari KOL Management</p>
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="creator-stat-grid" id="kol-stats">
        <div class="creator-stat-card">
          <div class="creator-stat-icon purple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="creator-stat-info">
            <div class="value" id="stat-total">—</div>
            <div class="label">Total KOL</div>
          </div>
        </div>
        <div class="creator-stat-card">
          <div class="creator-stat-icon green">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="creator-stat-info">
            <div class="value" id="stat-deal">—</div>
            <div class="label">Sudah Deal</div>
          </div>
        </div>
        <div class="creator-stat-card">
          <div class="creator-stat-icon orange">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="creator-stat-info">
            <div class="value" id="stat-priority">—</div>
            <div class="label">Talent Prioritas</div>
          </div>
        </div>
        <div class="creator-stat-card">
          <div class="creator-stat-icon pink">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <div class="creator-stat-info">
            <div class="value" id="stat-avgscore">—</div>
            <div class="label">Avg Score</div>
          </div>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar" style="margin-bottom:16px;flex-wrap:wrap;gap:8px;">
        <label>Toko:</label>
        <select id="fil-toko">
          <option value="">Semua Toko</option>
        </select>
        <label>Status:</label>
        <select id="fil-status">
          <option value="">Semua Status</option>
          <option value="new">Belum Hubungi</option>
          <option value="contacted">Dihubungi</option>
          <option value="replied">Reply</option>
          <option value="deal">Deal</option>
          <option value="followup">Follow Up</option>
          <option value="rejected">Rejected</option>
        </select>
        <label>Tier:</label>
        <select id="fil-tier">
          <option value="">Semua Tier</option>
          <option value="nano">Nano</option>
          <option value="micro">Micro</option>
          <option value="rising">Rising</option>
          <option value="mid">Mid</option>
          <option value="macro">Macro</option>
          <option value="mega">Mega</option>
        </select>
        <label>Evaluasi:</label>
        <select id="fil-eval">
          <option value="">Semua Hasil</option>
          <option value="Bagus">Bagus</option>
          <option value="Cukup">Cukup</option>
          <option value="Kurang">Kurang</option>
          <option value="__none">Belum Dievaluasi</option>
        </select>
        <input type="text" id="fil-search" placeholder="Cari nama / TikTok..." style="min-width:180px;">
      </div>

      <!-- Tabel KOL -->
      <div class="table-wrap">
        <table class="data-table" id="kol-table">
          <thead>
            <tr>
              <th>Nama KOL</th>
              <th>TikTok</th>
              <th>Followers</th>
              <th>Tier</th>
              <th>Score</th>
              <th>Status</th>
              <th>Toko</th>
              <th>Niche / Produk</th>
              <th>Video</th>
              <th>Kode Boost</th>
              <th>Evaluasi</th>
            </tr>
          </thead>
          <tbody id="kol-tbody">
            <tr><td colspan="11" style="text-align:center;padding:40px;color:#94a3b8;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="toast-container" class="toast-container"></div>
    </div>
  </div>
</div>
<script src="js/creator-kol.js"></script>
</body>
</html>
