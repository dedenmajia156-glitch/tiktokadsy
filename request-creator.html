<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<title>Request Creator — Ads Dashboard GMV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/kol-db.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/adv-switcher.js"></script>
</head>
<body>
<div class="app-wrap">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="page-content">

      <div class="page-header">
        <div>
          <h2>📩 Request Creator</h2>
          <p>Request KOL atau Affiliator baru untuk dihubungi tim</p>
        </div>
      </div>

      <!-- Form Request -->
      <div class="card" style="max-width:520px;margin-bottom:28px;padding:24px;">
        <div style="font-weight:700;font-size:14px;margin-bottom:16px;color:var(--text);">Form Request Creator</div>

        <div style="margin-bottom:14px;">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;">Username TikTok <span style="color:#ef4444;">*</span></label>
          <div style="display:flex;align-items:center;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;transition:border .2s;" id="tiktok-wrap">
            <span style="padding:0 10px;color:#94a3b8;font-size:13px;font-weight:600;background:#f8fafc;border-right:1px solid #e2e8f0;height:40px;display:flex;align-items:center;">@</span>
            <input id="inp-tiktok" type="text" placeholder="username_tiktok"
              style="flex:1;border:none;outline:none;padding:0 12px;font-family:inherit;font-size:13px;height:40px;"
              onfocus="document.getElementById('tiktok-wrap').style.borderColor='var(--primary)'"
              onblur="document.getElementById('tiktok-wrap').style.borderColor='#e2e8f0'">
          </div>
        </div>

        <div style="margin-bottom:14px;">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;">Toko <span style="color:#ef4444;">*</span></label>
          <select id="inp-toko" onchange="onTokoChange()"
            style="width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:0 12px;font-family:inherit;font-size:13px;height:40px;outline:none;transition:border .2s;"
            onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='#e2e8f0'">
            <option value="">— Pilih Toko —</option>
          </select>
        </div>

        <div style="margin-bottom:14px;">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;">Produk</label>
          <select id="inp-produk"
            style="width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:0 12px;font-family:inherit;font-size:13px;height:40px;outline:none;transition:border .2s;"
            onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='#e2e8f0'">
            <option value="">— Pilih Produk (opsional) —</option>
          </select>
        </div>

        <div style="margin-bottom:18px;">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;">Catatan / Alasan Request</label>
          <textarea id="inp-catatan" rows="3" placeholder="Contoh: KOL ini bagus untuk produk X, followernya relevan dengan target market kita..."
            style="width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;resize:none;outline:none;box-sizing:border-box;transition:border .2s;"
            onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='#e2e8f0'"></textarea>
        </div>

        <button onclick="submitRequest()" id="btn-submit" class="btn-primary" style="width:100%;padding:10px;font-size:14px;">
          Kirim Request
        </button>
      </div>

      <!-- Filter Histori -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <div style="font-weight:700;font-size:14px;color:var(--text);">Histori Request</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="fil-status" style="border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:12px;outline:none;">
            <option value="">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="done">Done</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>

      <!-- Tabel Histori -->
      <div class="table-wrap">
        <table class="data-table" id="req-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Username TikTok</th>
              <th>Toko</th>
              <th>Produk</th>
              <th>Catatan</th>
              <th>Advertiser</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="req-tbody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="toast-container" class="toast-container"></div>
    </div>
  </div>
</div>
<script src="js/request-creator.js"></script>
</body>
</html>
